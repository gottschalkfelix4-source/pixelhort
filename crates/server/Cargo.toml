[package]
name = "pixelhort-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pixelhort-server"
path = "src/main.rs"

[dependencies]
pixelhort-common = { path = "../common" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
sha1.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
pgvector = { version = "=0.4.1", features = ["sqlx"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
thumbhash = "0.1"
kamadak-exif = "0.6"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
cron = "0.15"
walkdir = "2"
globset = "0.4"
notify = "8"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
mime_guess = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
roxmltree = "0.20"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
