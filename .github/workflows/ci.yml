name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: ML service
        working-directory: crates/ml
        run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: pixelhort-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project Pixelhort.xcodeproj -scheme Pixelhort \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO -quiet build

  # Runs the iOS app in the simulator against a real server: login, photo backup, timeline.
  ios-e2e:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: PostgreSQL with pgvector
        run: |
          brew install postgresql@17 pgvector exiftool xcodegen
          PG="$(brew --prefix postgresql@17)/bin"
          echo "$PG" >> "$GITHUB_PATH"
          brew services start postgresql@17
          for i in $(seq 1 60); do "$PG/pg_isready" -h localhost && break; sleep 1; done
          "$PG/createdb" -h localhost pixelhort
      - name: Start Pixelhort server
        run: |
          cargo build -p pixelhort-server
          mkdir -p "$RUNNER_TEMP/phdata"
          PH_DATABASE_URL="postgres://$USER@localhost:5432/pixelhort" PH_DATA_DIR="$RUNNER_TEMP/phdata" \
            PH_REVERSE_GEOCODING=false PH_METRICS_LISTEN=off PH_LOG="info,tower_http=debug" \
            nohup target/debug/pixelhort-server > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 90); do curl -fs localhost:2342/api/server/ping && break; sleep 2; done
          TOKEN=$(curl -fs -X POST localhost:2342/api/auth/setup -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"supersecret1","name":"Admin"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["accessToken"])')
          curl -fs -X POST localhost:2342/api/admin/users -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"email":"ios@example.com","password":"iostester1","name":"iOS Tester"}'
      - name: Boot simulator and add photos
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ids=[x["udid"] for rt,l in sorted(d.items(), reverse=True) if "iOS" in rt for x in l if x["name"].startswith("iPhone")]
          print(ids[0])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl addmedia "$UDID" tests/fixtures/*.jpg
          xcrun simctl privacy "$UDID" grant photos app.pixelhort || true
      - name: UI test (login, backup, timeline)
        working-directory: mobile/ios
        env:
          TEST_RUNNER_PH_TEST_SERVER: http://localhost:2342
          TEST_RUNNER_PH_TEST_MIN_ASSETS: "3"
        run: |
          xcodegen generate
          xcodebuild test -project Pixelhort.xcodeproj -scheme Pixelhort -destination "id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult" CODE_SIGNING_ALLOWED=NO -quiet
      - name: Test report and screenshots
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/ui-tests.xcresult" || true
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ui-tests.xcresult" | python3 -c '
          import json,sys
          def walk(n):
              for d in n.get("children", []):
                  if d.get("nodeType") == "Failure Message": print("FAILURE:", d.get("name"))
                  walk(d)
          for n in json.load(sys.stdin).get("testNodes", []): walk(n)' || true
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui-tests.xcresult" --output-path "$RUNNER_TEMP/screenshots" || true
          ls "$RUNNER_TEMP/screenshots" || true
          grep -E "started processing request|finished processing request" "$RUNNER_TEMP/server.log" | sed 's/\x1b\[[0-9;]*m//g' | tail -40 || true
      - name: Verify uploads on the server
        run: |
          T=$(curl -fs -X POST localhost:2342/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"ios@example.com","password":"iostester1"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["accessToken"])')
          curl -fs "localhost:2342/api/sync/delta?updatedAfter=2000-01-01T00:00:00Z" -H "Authorization: Bearer $T" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["upserted"]
          for a in d: print(a["originalFileName"], a["type"], a["deviceId"], a["width"], "x", a["height"])
          assert len(d) >= 3, "expected at least 3 uploaded assets"
          assert all(a["deviceId"] for a in d), "uploads must carry the device id"'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-results
          path: |
            ${{ runner.temp }}/ui-tests.xcresult
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/server.log
